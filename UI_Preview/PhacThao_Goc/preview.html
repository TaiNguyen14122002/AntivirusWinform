      if (f.key==='virustotal'&&el.checked&&!state.keySaved) {el.checked=false;say('Dữ liệu mẫu: hãy cấu hình API key trong Cài đặt → VirusTotal.');return;}

  root.addEventListener('click',event=>{

    if (button.dataset.mode) {state.mode=button.dataset.mode;render();root.querySelector(`[data-mode="${state.mode}"]`).focus();return;}
    if (button.dataset.detail) {state.detail=button.dataset.detail;render();root.querySelector(`[data-detail="${state.detail}"]`).focus();return;}

    if (cmd==='restore'||cmd==='delete') {const count=state.selected.size;quarantine=quarantine.filter(f=>!state.selected.has(f.id));state.selected.clear();render();say(`Dữ liệu mẫu: ${cmd==='restore'?'đã khôi phục':'đã xóa'} ${count} tệp.`);}
    if (cmd==='save-settings') {root.querySelector('#sv-saved-label').textContent='Đã lưu thiết lập mẫu.';say('Đã lưu thiết lập trong phác thảo.');}
    if (cmd==='defaults') {general.forEach(f=>f.on=f.key!=='samples');features.forEach(f=>f.on=f.key!=='virustotal');render();say('Đã hiển thị thiết lập mặc định mẫu.');}
    if (cmd==='save-key') {const input=root.querySelector('#sv-api-key');if(!input.value.trim()){say('Nhập API key mẫu để xem trạng thái đã cấu hình.');input.focus();return;}state.keySaved=true;render();say('Đã cấu hình API key mẫu. Không có kết nối API.');}
    if (cmd==='clear-key') {state.keySaved=false;features.find(f=>f.key==='virustotal').on=false;render();say('Đã gỡ API key mẫu.');}
    if (cmd==='choose-folder'||cmd==='choose-files') say(cmd==='choose-folder'?'Phác thảo chọn thư mục: C:\\Users\\User\\Downloads':'Phác thảo chọn tệp: 2 tệp mẫu.');
    if (['update','refresh','export','vt-query','open-data','clear-cache','samples'].includes(cmd)) {
      const messages={update:'CSDL chữ ký mẫu đã cập nhật.',refresh:'Đã làm mới danh sách mẫu.',export:'Phác thảo thao tác xuất CSV lịch sử.', 'vt-query':'Đang xem kết quả VirusTotal mẫu.', 'open-data':'Phác thảo thao tác mở thư mục dữ liệu.', 'clear-cache':'Đã hiển thị trạng thái xóa cache mẫu.',samples:'Phác thảo thao tác tạo tệp kiểm thử.'};
      say(messages[cmd]);
    }
  });
  render();
})();
</script>
<script>lucide.createIcons({attrs:{width:16,height:16}})</script></body></html>
